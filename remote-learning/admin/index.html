<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بوابة القيادات | منصة التحويل إلى التعلم عن بُعد</title>
<meta name="description" content="بوابة القيادات لاعتماد طلبات تحويل المدارس إلى التعلم عن بُعد ومتابعتها — تعليم جازان.">
<meta name="theme-color" content="#1a6b6c">
<meta property="og:title" content="بوابة القيادات | منصة التحويل إلى التعلم عن بُعد">
<meta property="og:description" content="بوابة القيادات لاعتماد طلبات تحويل المدارس إلى التعلم عن بُعد ومتابعتها — تعليم جازان.">
<meta property="og:type" content="website">
<meta property="og:locale" content="ar_SA">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="preconnect" href="https://script.google.com">
<style>
  html, body { margin: 0; height: 100%; background: #edf3f2; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #edf3f2; }
  #loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 2;
    background: linear-gradient(115deg, #5fb3a8 0%, #2f8c86 40%, #1a6b6c 75%, #135a5d 100%);
    font-family: "Segoe UI", Tahoma, Arial, sans-serif; color: #fff; transition: opacity .45s ease; }
  #loader.hide { opacity: 0; pointer-events: none; }
  .box { text-align: center; padding: 24px; }
  .box img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 14px 30px -10px rgba(0,0,0,.4); }
  .box h1 { font-size: 19px; margin: 18px 0 6px; font-weight: 700; line-height: 1.6; }
  .box p { margin: 0; font-size: 13px; opacity: .85; }
  .bar { width: 160px; height: 4px; margin: 18px auto 0; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
  .bar::after { content: ""; display: block; width: 40%; height: 100%; border-radius: 4px;
    background: linear-gradient(90deg, #b08a3e, #ecd28f); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { from { transform: translateX(260%); } to { transform: translateX(-120%); } }
  @media (prefers-reduced-motion: reduce) { .bar::after { animation: none; width: 100%; } }
  noscript a, .fallback a { color: #ecd28f; }
  .fallback { margin-top: 14px; font-size: 12.5px; opacity: 0; transition: opacity .3s; }
  .fallback.show { opacity: .9; }
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="box">
    <img src="../favicon.svg" alt="">
    <h1>بوابة القيادات — اعتماد طلبات التحويل عن بُعد</h1>
    <p>الإدارة العامة للتعليم بمنطقة جازان · إدارة الإدارة المدرسية</p>
    <div class="bar"></div>
    <div class="fallback" id="fallback">تأخر التحميل؟ <a href="https://script.google.com/macros/s/AKfycbwpt5IFOvQ0ku6YhEU218ZH9yb2WzuDJrxMdbPQP_rDcyQW37b-TPuU3OK-YQnSxg6KNg/exec?page=admin" target="_top">افتح المنصة مباشرة</a></div>
  </div>
</div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbwpt5IFOvQ0ku6YhEU218ZH9yb2WzuDJrxMdbPQP_rDcyQW37b-TPuU3OK-YQnSxg6KNg/exec?page=admin" title="بوابة القيادات | منصة التحويل إلى التعلم عن بُعد" allow="clipboard-write; fullscreen" referrerpolicy="no-referrer-when-downgrade"></iframe>
<noscript><p style="text-align:center"><a href="https://script.google.com/macros/s/AKfycbwpt5IFOvQ0ku6YhEU218ZH9yb2WzuDJrxMdbPQP_rDcyQW37b-TPuU3OK-YQnSxg6KNg/exec?page=admin">افتح المنصة</a></p></noscript>
<script>
  var loader = document.getElementById('loader');
  document.getElementById('app').addEventListener('load', function () { loader.classList.add('hide'); });
  setTimeout(function () { document.getElementById('fallback').classList.add('show'); }, 8000);

  // تنزيل ملفات Excel المصدّرة من المنصة عبر الصفحة الأساسية (التنزيل من داخل الإطار يُنتج ملفاً تالفاً)
  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || d.type !== 'jz-download' || !d.base64) return;
    if (!/^https:\/\/([a-z0-9-]+\.)*googleusercontent\.com$/.test(e.origin) && e.origin !== 'https://script.google.com') return;
    var bin = atob(d.base64), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    var blob = new Blob([bytes], { type: d.mime || 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = String(d.fileName || 'export.xlsx').replace(/[\\\/:*?"<>|]/g, '-');
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
  });
</script>
</body>
</html>
